name: Registry install test

# Installs the published shadcn item into a clean project with the real CLI, builds it, and opens it
# in a browser (scripts/registry-install-test.ts), then feeds the CLI bad names, malformed items and
# unsafe paths (scripts/registry-failure-test.ts). Both need the network, so they are not part of the
# main CI job. The CLI version is the pinned `shadcn` devDependency, not a version written here.

on:
  push:
    branches: [main]
    paths: &paths
      - 'public/r/**'
      - 'src/registry/shadcn/**'
      - 'src/components/ui/kbd.tsx'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/registry-install.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:
  # Weekly, so a change in the npm registry, the Vite template, or the published schemas shows up.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: registry-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [pnpm, npm]
    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm registry:install-test --runner ${{ matrix.runner }}
      - run: pnpm registry:failure-test --runner ${{ matrix.runner }}

  # Compares the saved JSON Schemas with the published ones. Scheduled or manual only, so a pull
  # request never fails because ui.shadcn.com changed or could not be reached.
  schema:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:verify-schema
