name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Also part of pnpm test; run on its own so a broken link or import in the docs is named.
      - run: pnpm docs:check
      # Same for the engineering notes: a code block that is not in its file, or a missing
      # section, is named on its own.
      - run: pnpm notes:check
      # Also part of pnpm test; run on its own so a stale file under public/r is named. The install
      # test that needs the network is in registry-install.yml.
      - run: pnpm registry:check
      - run: pnpm test
      - run: pnpm build
      # The files the site needs exist, index.html loads only root-absolute files, no source maps, and
      # no VITE_ setting other than the map settings, secret or credential is in the output. No
      # VITE_ variable is set in this workflow, so the tests and the build stay offline.
      - run: pnpm dist:check

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # The HTML report, and the traces of tests that failed their first try (test-results/).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
