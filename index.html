<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hieu UI Lab — reusable React components, UI blocks, and frontend engineering experiments."
    />
    <!-- Defaults for crawlers that do not run JavaScript; RouteMetadata updates them per route. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hieu UI Lab" />
    <meta property="og:title" content="Hieu UI Lab" />
    <meta
      property="og:description"
      content="Hieu UI Lab — reusable React components, UI blocks, and frontend engineering experiments."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hieu UI Lab</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('hieu-ui-lab:theme') || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
